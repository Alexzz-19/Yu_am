name: CI YUAM v2.0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x con caché npm
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de Linting
        run: npm run lint

      - name: Verificación estricta de tipos TypeScript
        run: npx tsc --noEmit

      - name: Prueba de compilación de producción
        run: npm run build
